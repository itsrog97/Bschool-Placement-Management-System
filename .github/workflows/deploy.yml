name: IIFT PlaceComm CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking & Linter
        run: npm run lint

      - name: Verify Production Build
        run: npm run build
        env:
          NODE_ENV: production

  docker-and-deploy:
    name: Build Container & Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: iift-placecomm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Notification
        run: |
          echo "Build & Verification successful for IIFT PlaceComm. Ready for Cloud Run / Vercel production deployment."
